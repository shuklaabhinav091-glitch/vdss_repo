; VDSS edge controller — PlatformIO project
; Board: Arduino UNO (ATmega328P)

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_ldf_mode = deep+   ; resolve nested includes (BusIO needs SPI.h)
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
