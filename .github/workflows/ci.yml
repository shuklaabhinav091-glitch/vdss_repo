name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Build firmware (UNO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      # Builds with config.example.h placeholders + weak stubs (private files are not in the repo)
      - run: pio run -d firmware

  analysis:
    name: Analysis pipeline smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r analysis/requirements.txt
      - run: python analysis/protocol_v1_analysis.py analysis/data/sample/synthetic_pipeline_test.csv
